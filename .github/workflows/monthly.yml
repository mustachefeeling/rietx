name: monthly

# The two most expensive kinds of coverage, on the longest cadence, because
# this repo is private on a free plan: 2000 Actions minutes/month, and **macOS
# bills at a 10x multiplier** — 5 wall-clock minutes there costs 50.
#
#   macOS (fast suite + goldens)   ~4-7 min x10 (2026-07-29 -> 2026-08-06), dispatch-only
#   torch agreement matrix         ~16 min x1, on the cron
#
# The scheduled run bills the torch line only; macOS runs when dispatched
# (WP-1060 — grounds on the job).  Neither job
# guards a fast-moving surface: the goldens' capture platform does not change,
# and torch is an experimental backend, not a supported runtime.  No monthly
# totals in comments — they rot; read spend from the Actions usage page or
# `gh run list`.
#
# What each job is *for* — neither duplicates the weekly Linux run:
#
# * `macos` is the closest any runner gets to the bit-identity goldens' capture
#   machine, and close is all it gets: measured, it reproduces 7 of 8 states and
#   misses one by exactly one ulp, where Linux misses all 8 by up to ~1100.  So
#   this job *reports* the comparison and fails only if the goldens skip — see
#   that step's comment.  It runs the *fast* suite, not the full one: at 10x,
#   the slow acceptance would cost ~400 billed minutes, and it is already
#   covered weekly on Linux (weekly.yml).
# * `torch` is an independent opinion in the Jacobian-agreement matrix
#   (WP-0408), not a supported runtime.
#
# `workflow_dispatch` takes a `full_macos` input for the times the whole
# acceptance suite really is wanted on macOS — a release check, or after a
# change to the peak chain.  Publishing the repo for v1.0 removes the meter
# entirely, and then all of this can be one nightly again.

on:
  schedule:
    # 06:00 UTC on the 1st of the month
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      full_macos:
        description: "Run the full suite (incl. slow acceptance) on macOS — ~10x billing"
        type: boolean
        default: false

env:
  MPLBACKEND: Agg

jobs:
  macos:
    # Dispatch-only since WP-1060: the dev machine *is* darwin/arm64 and runs
    # the fast suite + goldens on every local run, while this runner is
    # measurably not the capture machine (one ulp off on toy_rich — the step
    # below only warns), so the cron leg bought ~70 of the workflow's ~86
    # monthly billed minutes for coverage the goldens' own platform already
    # has.  tests/test_backend_shim.py's on-the-golden-platform guard is the
    # local half of this trade: it fails there if the goldens would skip.
    if: github.event_name == 'workflow_dispatch'
    name: macOS (goldens' capture platform)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Record the environment
        run: |
          .venv/bin/python -c "import sys, platform, numpy, scipy; print(sys.version, sys.platform, platform.machine()); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          .venv/bin/python -c "import numpy; numpy.show_config()"
      - name: Suite
        # the bit-identity gate is deselected and run as its own step below.
        # Measured 2026-07-29: this runner does *not* reproduce the capture
        # machine's bits, even at identical numpy/scipy/Accelerate — see that
        # step's comment.  Requiring them here would redden the tree every month for
        # a one-ulp difference in a system math library.
        run: |
          DESELECT="--deselect tests/test_backend_shim.py::test_numpy_path_bit_identical_to_golden"
          if [ "${{ inputs.full_macos }}" = "true" ]; then
            .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25 $DESELECT
          else
            .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow" $DESELECT
          fi
      - name: Bit-identity goldens — informational, and a check they did not skip
        # What this step can and cannot claim, measured on the first run:
        # 7 of 8 toy states are bit-identical here, and `toy_rich:y_calc`
        # differs by 1.4210854715202004e-14 — *exactly* one ulp at a value in
        # [64,128), on a single element.  The runner reports the same numpy
        # 2.5.1, scipy 1.18.0 and Accelerate as the capture machine, and local
        # runs at 1/2/4/8 BLAS threads are bit-stable, so the discriminator is
        # the system math library (macOS image version) and nothing Python can
        # fingerprint.  Compare Linux x86-64: all 8 states, up to ~1100 ulp.
        #
        # So no CI image asserts these bits — that is a documented gap, the
        # same shape as the Apple-GPU one.  What this step *does* enforce is
        # that they did not silently skip, because a skip and a pass look
        # identical in a summary line; a numeric mismatch is reported as a
        # warning so drift (say 5 states, or a large delta) stays visible.
        run: |
          set +e
          out=$(.venv/bin/python -m pytest tests/test_backend_shim.py -k bit_identical -m "not slow" -rs)
          echo "$out"
          if echo "$out" | grep -qE "skipped|no tests ran"; then
            echo "::error::the goldens skipped on darwin/arm64 — the platform pin is broken, and nothing anywhere is checking them"
            exit 1
          fi
          if echo "$out" | grep -qE "^[0-9]+ failed"; then
            echo "::warning::goldens differ on this runner — expected at ~1 ulp; investigate only if the count or size grew (see tests/data/README.md)"
          fi
          exit 0
      - name: Upload obs/calc/diff plots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-macos
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  torch:
    # EXPERIMENTAL backend: an independent opinion in the Jacobian-agreement
    # matrix, not a supported runtime.  CPU fp64 only —
    # torch.backends.mps.is_available() is False on hosted macOS runners
    # (virtualised, no Metal device), so every `torch-mps` assertion self-skips
    # in CI and the Apple-GPU evidence for the WP-0403 fp32-column policy stays
    # maintainer-machine-only.  Do not read this job green as "MPS verified".
    name: torch agreement matrix (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax,torch]"
      - name: Every backend installed at once
        # Deliberately *not* `-n auto`: tests/test_cross_backend.py caches one
        # built Jacobian callable per (config, backend) so the fp32 rows reuse
        # the compiled one, which halved that file's runtime (WP-0404).  xdist
        # would give each worker its own cold cache and pay every compile
        # again.  If this step ever needs to be faster, measure both — do not
        # assume parallel wins.
        run: |
          .venv/bin/python -m pytest \
            tests/test_cross_backend.py \
            tests/test_backend_conformance.py \
            tests/test_backend_torch.py \
            tests/test_backend_jax.py \
            tests/test_backend_shim.py
      - name: Assert the MPS rows really did skip rather than silently vanish
        run: .venv/bin/python -c "import torch; assert not torch.backends.mps.is_available(), 'hosted runner grew a Metal device — promote the MPS assertions out of maintainer-only status'"
