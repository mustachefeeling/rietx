name: weekly

# Everything the 5-minute per-push gate leaves out, once a week instead of
# once a night.  This replaced a **nightly** full-suite job that billed two
# thirds of a free-tier private repo's entire 2000-minute allowance before a
# single push (billed = rounded up per job, Linux 1x).
#
#   full suite incl. slow acceptance   44-78 min (2026-07-29 -> 2026-08-06)
#   fast py3.11 / py3.14               ~2-4 min each
#
# No run or monthly totals here — a cross-workflow total written in a comment
# rots (one sat at 303 against a measured ≈495); read spend from the Actions
# usage page or `gh run list`, never from comments.
#
# The full-suite job installs `[dev,jax]`, so it *is* the jax coverage — a
# separate jax job would re-pay the ~10 billed minutes those rows cost.  They
# are jit-compile bound, and an actions/cache of tests/.jax_cache was measured
# not to help (8:18 warm against 8:12 cold), so there is no cache step.
#
# macOS and torch live in monthly.yml — macOS bills at a **10x** multiplier.
#
# Going public makes standard runners free, at which point all three cadences
# can collapse back into one nightly; see docs/wp/1003-api-freeze-pypi.md.

on:
  schedule:
    # 06:00 UTC on Sundays
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  full:
    name: full suite (Linux, incl. slow acceptance)
    runs-on: ubuntu-latest
    # raised from 90 after measured drift 44:21 -> 77:52 (WP-1060), and from
    # 120 after the drift past it was investigated rather than silently
    # raised (WP-1003): the 2026-08-16 run *completed* at 1h57 — no hang, the
    # suite grew, and 77 min of it is indexing-acceptance fixture setup on
    # the 2-core runner (top four --durations rows). The durable lever is
    # narrowing what those fixtures search (the post-1003 indexing work);
    # this guard stays a runaway guard, calibrated above the measured runtime
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Record the environment
        run: |
          .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          .venv/bin/python -c "import numpy; numpy.show_config()"
      - name: Full suite
        # the bit-identity goldens skip here — pinned to darwin/arm64
        # (tests/test_backend_shim.py, GOLDEN_PLATFORM); monthly.yml reports
        # the comparison, and no CI runner reproduces their capture machine
        run: .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25
      - name: Upload obs/calc/diff plots
        # every test refinement writes them (CLAUDE.md's Tests convention);
        # Rwp hides locally-bad fits, so on a failure these are the first
        # thing to look at
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-linux
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  pythons:
    # The support-window boundaries only (WP-1060): 3.12 is the dev venv,
    # exercised on every local run, and 3.13 runs per-push — so the weekly
    # matrix keeps just the edges, the only thing that would catch a
    # 3.11-incompatible construct before a release.
    name: fast py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 3.14 is ahead of the support window; a missing wheel there must not
    # redden a green tree
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
