name: weekly

# The two expensive kinds of coverage, run once a week instead of once a night
# because this repo is private on a free plan: Actions minutes are metered at
# 2000/month, macOS bills at a **10x multiplier**, and torch is a ~500 MB wheel.
#
# What each job is *for* — neither is a duplicate of the nightly Linux run:
#
# * `macos` is the only place the bit-identity goldens are asserted.  They are
#   pinned to darwin/arm64 (tests/test_backend_shim.py, GOLDEN_PLATFORM) after
#   WP-1002 measured Linux x86-64 diverging by up to 1.7e-13 relative — a libm
#   and summation-order difference, not a code difference.  It runs the *fast*
#   suite, not the full one: at 10x, the slow acceptance would cost ~400
#   charged minutes, and it is already covered nightly on Linux.
# * `torch` is an independent opinion in the Jacobian-agreement matrix
#   (WP-0408), not a supported runtime.
#
# `workflow_dispatch` takes a `full_macos` input for the times the whole
# acceptance suite really is wanted on macOS — a release check, or after a
# change to the peak chain.  Publishing the repo for v1.0 removes the meter
# entirely, and then both jobs belong in nightly.yml.

on:
  schedule:
    # 06:00 UTC on Sundays
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      full_macos:
        description: "Run the full suite (incl. slow acceptance) on macOS — ~10x billing"
        type: boolean
        default: false

env:
  MPLBACKEND: Agg

jobs:
  macos:
    name: macOS (goldens' capture platform)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Restore the JAX compile cache
        # see nightly.yml; at a 10x billing multiplier this job is the one
        # where a cold jit cache costs the most
        uses: actions/cache@v4
        with:
          path: tests/.jax_cache
          key: jax-cache-weekly-${{ runner.os }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            jax-cache-weekly-${{ runner.os }}-
      - name: Record the environment
        run: |
          .venv/bin/python -c "import sys, platform, numpy, scipy; print(sys.version, sys.platform, platform.machine()); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          .venv/bin/python -c "import numpy; numpy.show_config()"
      - name: Suite
        run: |
          if [ "${{ inputs.full_macos }}" = "true" ]; then
            .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25
          else
            .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
          fi
      - name: Bit-identity goldens must actually run on their capture platform
        # they *skip* everywhere else, and a skip reads exactly like a pass in a
        # summary line.  This is the one job that asserts them, so it says so
        # out loud: if they skip here, nothing in CI is checking them at all.
        run: |
          out=$(.venv/bin/python -m pytest tests/test_backend_shim.py -k bit_identical -m "not slow" -rs)
          echo "$out"
          if echo "$out" | grep -qE "skipped|no tests ran"; then
            echo "::error::the goldens skipped (or vanished) on darwin/arm64 — nothing is checking them"
            exit 1
          fi
          # and they must be the eight toy states, not some subset a -k typo left
          echo "$out" | grep -qE "^8 passed" || {
            echo "::error::expected exactly 8 golden states to run; see the summary above"
            exit 1
          }
      - name: Upload obs/calc/diff plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-macos
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  torch:
    # EXPERIMENTAL backend: an independent opinion in the Jacobian-agreement
    # matrix, not a supported runtime.  CPU fp64 only —
    # torch.backends.mps.is_available() is False on hosted macOS runners
    # (virtualised, no Metal device), so every `torch-mps` assertion self-skips
    # in CI and the Apple-GPU evidence for the WP-0403 fp32-column policy stays
    # maintainer-machine-only.  Do not read this job green as "MPS verified".
    name: torch agreement matrix (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax,torch]"
      - name: Every backend installed at once
        run: |
          .venv/bin/python -m pytest \
            tests/test_cross_backend.py \
            tests/test_backend_conformance.py \
            tests/test_backend_torch.py \
            tests/test_backend_jax.py \
            tests/test_backend_shim.py
      - name: Assert the MPS rows really did skip rather than silently vanish
        run: .venv/bin/python -c "import torch; assert not torch.backends.mps.is_available(), 'hosted runner grew a Metal device — promote the MPS assertions out of maintainer-only status'"
