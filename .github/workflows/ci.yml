name: CI

# The per-push gate, sized for a **free-tier private repo**: GitHub Free
# includes 2000 Actions minutes/month for private repositories, jobs are billed
# rounded UP to the whole minute, and the default spending limit is $0 — so an
# over-budget config does not produce a bill, it produces a month with no CI.
#
# Measured 2026-07-29, so the arithmetic is real rather than assumed:
#
#   lint                     23 s  -> 1 min
#   fast py3.13 (numpy only) ~3 min -> 4 min      == 5 billed minutes per push
#
# The first version of this workflow ran four Pythons plus a `[dev,jax]` job
# and cost **21 minutes per push** — the jax job alone bills 10, because it is
# jit-compile bound (see the note in weekly.yml).  The rest of the Python
# matrix and every optional backend now run on a schedule instead, where they
# cost a fixed amount per month rather than a variable amount per commit.
#
# `paths-ignore` skips pushes that touch only inert documentation.  It
# deliberately does NOT ignore docs/manual/** or docs/VALIDATION.md: the suite
# builds the manual under -W and asserts VALIDATION.md matches its generator,
# so those two are code as far as the tests are concerned.
#
# Every job skips the push run for a PR merge commit (the `if:` below): the
# pull_request run already tested that tree, so the post-merge rerun was pure
# double payment (~9-22 billed min per merged PR, measured 2026-08-06).  NOT
# PR-only triggers — 23 of the last 60 direct-to-main commits touch code and
# would go untested until Sunday.  Accepted risks, stated rather than assumed:
# (a) merging after main moved lands a combined tree untested until the next
# tested push or the weekly; (b) a push bundling direct commits under a merge
# head commit is skipped whole — rare, and it heals at the next tested push
# since CI tests trees, not diffs.  A switch to squash merges makes the
# condition match nothing, which fails toward extra runs, never lost coverage.
#
# When the repo goes public, standard runners become free and all of this
# shaping can be undone — see docs/wp/1003-api-freeze-pypi.md.

on:
  push:
    branches: [main]
    paths-ignore: &inert_docs
      - 'docs/wp/**'
      - 'docs/milestones/**'
      - 'docs/ROADMAP.md'
      - 'docs/DESIGN.md'
      - 'docs/AGENT_PROTOCOL.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'ATTRIBUTION.md'
      - 'LICENSE'
  pull_request:
    paths-ignore: *inert_docs
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  lint:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests examples

  fast:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    name: fast suite (py3.13, numpy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - name: Record the environment
        run: .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Fast suite
        # --dist loadgroup is not optional: it honours the xdist_group marks
        # that pin a shared expensive fixture to one worker.  Plain --dist load
        # still passes, but silently refits.
        run: .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
