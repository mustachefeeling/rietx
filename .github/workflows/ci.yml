name: CI

# The per-push gate on a public repo, where standard runners are free.  This
# workflow was shaped for a free-tier private repo from WP-1002 until WP-1003
# (5 billed minutes per push: lint + one fast job, docs pushes skipped, PR
# merge commits skipped); the flip to public undid the shaping — the history
# of the shaped version and its measured arithmetic is in git, and the story
# in docs/wp/1003-api-freeze-pypi.md.
#
# What runs per push and per PR, all in parallel:
#
#   lint                          ruff over src/tests/examples
#   fast py3.11 .. py3.14         the "not slow" suite across the support
#                                 window (3.14 is claimed in the classifiers,
#                                 so it gates like the rest)
#   fast jax                      the same selection with [dev,jax] — the jax
#                                 rows are jit-compile bound, so this is the
#                                 slowest job here (~10 min)
#
# No paths-ignore: these jobs are branch-protection required checks, and a
# path filter would leave a docs-only PR with required checks that never
# report.  The docs-consistency test rides inside the fast suite.
# The full suite (slow real-data acceptance included), macOS, Windows and
# torch run in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests examples

  fast:
    name: fast py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: Record the environment
        run: .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Fast suite
        # --dist loadgroup is not optional: it honours the xdist_group marks
        # that pin a shared expensive fixture to one worker.  Plain --dist load
        # still passes, but silently refits.
        run: .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"

  fast-jax:
    name: fast jax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Fast suite with jax installed
        # jit-compile bound; an actions/cache of tests/.jax_cache was measured
        # not to help (8:18 warm against 8:12 cold — weekly.yml's note, kept
        # with the job it explains), so there is no cache step.
        run: .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
