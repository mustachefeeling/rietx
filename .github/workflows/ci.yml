name: CI

# The per-push gate on a public repo, where standard runners are free.  This
# workflow was shaped for a free-tier private repo from WP-1002 until WP-1003
# (5 billed minutes per push: lint + one fast job, docs pushes skipped, PR
# merge commits skipped); the flip to public undid the shaping — the history
# of the shaped version and its measured arithmetic is in git, and the story
# in docs/wp/1003-api-freeze-pypi.md.
#
# What runs per push, and per PR once it is out of draft:
#
#   lint                          ruff over src/tests/examples, and on a PR
#                                 the skill size limits against its base; the
#                                 one job a draft PR runs (~40 s)
#   changes                       `scope`: docs when a PR changes only the
#                                 planning set, else code; a push is code
#   docs                          scope docs: the tests that read the planning
#                                 set (the job says how that list was measured)
#   fast py3.11 .. py3.14         scope code: the "not slow" suite across the
#                                 support window (3.14 is claimed in the
#                                 classifiers, so it gates like the rest)
#   fast jax                      scope code: the same selection with
#                                 [dev,jax], jit-compile bound, so the slowest
#                                 job here (20-21 min, 2026-09-25)
#   ci-ok                         whether the chosen suite passed; with lint,
#                                 the one check branch protection requires
#
# The timeouts are runaway guards, never timers (tests/CLAUDE.md § Budgets in
# tests).  On 2026-09-25, over main's last ten runs, the fast legs took
# 13-19.5 min, bimodal by runner, and jax 20-21 min.  At 20 and 30 min the
# caps cancelled py3.11 at 96 % on main (07952d4e) and twice on PR #463 with no
# test failing, so they are 30 and 40.  By 2026-10-04 the fast legs' median had
# reached 26-30 min and py3.11 was cancelled at 30 on 16 passing jobs in 14
# days (#745), so the fast legs are 40 as well.
#
# A docs-only PR skips the matrix through `changes`, never a path filter.  A
# workflow a filter skips reports nothing, so a required check it carries
# never appears, and a skipped matrix reports once under its literal name
# (below).  So branch protection names `lint` and `ci-ok` and no matrix leg;
# WP-1506 holds that by-hand change.  ci-ok is red when a job that should have
# run was skipped.  The legs upload their junit timings, which tests/CLAUDE.md
# § Budgets in tests reads.
#
# The draft guard is that same question answered the other way round.  A job
# skipped by a conditional reports success to branch protection, while a
# workflow skipped by a filter never reports at all (GitHub, "Troubleshooting
# required status checks"), so what a path filter may not do a job-level `if`
# may.  A WP branch is claimed with a draft PR on its first commit and readied
# by /wp-handover, so until this the whole matrix fired on every intermediate
# push: 71 runs over 30 WP branches in the claim ritual's first two days, 41 of
# them before the handover, 12 on the claim commit alone — 72 job-minutes over
# a markdown edit.  `ready_for_review` is in the trigger types because it is
# not one of the defaults, and `gh pr ready` is now what fires the gating run.
# Off a pull request `github.event.pull_request.draft` is null, which the
# expression language coerces to 0 and compares equal to false, so push and
# workflow_dispatch still run in full.  Measured on the PR that landed this
# (#364): a draft run is lint plus two skipped jobs, and a skipped matrix does
# not expand — it reports once, under the literal name `fast py${{
# matrix.python }}`.  So the four per-version contexts exist only from the
# ready_for_review run onwards, which is the run that gates the merge anyway.
# Since WP-1506 the guard sits on `changes` and `ci-ok`, and every job that
# needs `changes` skips with it.
#
# The full suite (slow real-data acceptance included), macOS, Windows and
# torch run in nightly.yml.
#
# `-n auto` is 2 workers here.  The 4-vCPU runner has 2 physical cores, and
# xdist counts physical cores once psutil imports.  `-n logical` was measured
# to buy nothing: four workers each ran at about half speed (WP-1547).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m ruff check src tests examples
      - name: Skill size limits
        # Here rather than in the suite because a draft runs this job alone,
        # and a WP branch lives as a draft: the author sees each capped file's
        # change and headroom in the run summary while still writing, and a
        # change growing one past its budget fails now, not at the merge.
        # HEAD^1 is the base, as in `changes`, hence fetch-depth 2.
        if: github.event_name == 'pull_request'
        run: .venv/bin/python -m tests.skill_caps
      - name: Skill rows to re-read
        # The public names, plan names, diagnostic codes and help keys this
        # change touches, each with the skill rows that mention it, in the run
        # summary.  It fails only on a removed name the skill still names
        # (WP-1907).  Same base as the step above.
        if: github.event_name == 'pull_request'
        run: .venv/bin/python -m tests.skill_surface

  changes:
    # Which suite this run needs, as `scope`: `docs` when every file the PR
    # changes is in the planning set, `code` otherwise.  HEAD is GitHub's
    # merge of the PR into its base, so HEAD^1 is the base and the diff is the
    # whole PR, whichever push this run is for.  --no-renames lists both sides
    # of a rename, so a file moved into docs/wp/ still counts where it came
    # from.  A push or a manual run is always `code`: 51 of main's 240 runs in
    # the month to 2026-09-27 were cancelled by the next push, and a docs-only
    # successor that skipped the matrix would leave the cancelled merge
    # untested.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PLANNING: '^(docs/(wp|milestones|releases)/|docs/(ROADMAP|DESIGN)\.md$|tests/test_docs_consistency\.py$|\.claude/(commands|agents|skills/issue-review)/|\.claude/settings\.json$|\.claude/hooks/(handover_owed|no_top_level_cd|session_start|worktree_create|worktree_only|worktree_remove|wp_claim)\.py$)'
        run: |
          scope=code
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD) || files=
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! grep -qvE "$PLANNING" <<< "$files"; then
              scope=docs
            fi
          fi
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"

  docs:
    # Every test file that reads the planning set, measured 2026-09-27 over
    # one fast run: an audit hook (sys.addaudithook, events `open`,
    # `os.listdir`, `os.scandir` and `subprocess.Popen`, in the pytest
    # process and every Python child) listed the files that open a planning
    # path.  test_docs_consistency and test_workflow_hooks read the documents,
    # the second through the hooks it runs.  test_portability parses every .py,
    # test_docs_consistency among them.  test_no_stale_name reads through
    # `git grep`, which only the Popen record showed.  A test that
    # reads the planning set from a new file joins this list, or a docs-only
    # PR skips it and the nightly finds it.
    #
    # The session machinery under .claude/ joined the planning set on
    # 2026-10-06, measured the same way over one fast run on main 443c0c1a.
    # Nothing opens the commands, the agent definition, the issue-review skill
    # or settings.json except test_no_stale_name's `git grep`.  The hooks
    # listed by name are imported or run only by test_workflow_hooks.  Three
    # paths stay code.  test_session_usage imports session_usage.py.
    # test_merge_replay runs wp_index.py as a script, which the audit hook
    # cannot see (the interpreter loads a script without an audited open), so
    # a text search over tests/ covered that gap.  skills/rietx/ is the
    # shipped skill, read by test_skill_cli.  A new hook is code until it is
    # listed.  Ten unrelated test files show an `os.listdir` of .claude/hooks
    # itself.  That is the import system listing a sys.path entry
    # test_workflow_hooks added in the same worker, not a read.
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - name: The tests that read the planning set
        run: >-
          .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
          tests/test_docs_consistency.py tests/test_workflow_hooks.py
          tests/test_no_stale_name.py tests/test_portability.py

  fast:
    name: fast py${{ matrix.python }}
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        # the newest leg executes the tutorials.  Dropping its version from
        # the list above makes this a leg of its own, so they never go unrun.
        include:
          - python: "3.14"
            tutorials: run
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - name: Record the environment
        run: .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Fast suite
        # --dist loadgroup is not optional: it honours the xdist_group marks
        # that pin a shared expensive fixture to one worker.  Plain --dist load
        # still passes, but silently refits.  The junit file carries each
        # test's setup, call and teardown time, uploaded below: the numbers the
        # next cut to this job's time is chosen from (tests/CLAUDE.md § Budgets
        # in tests).  The tutorial notebooks execute on the newest Python
        # alone (tests/test_tutorials.py says what that trades).
        env:
          RIETX_TUTORIALS: ${{ matrix.tutorials || 'skip' }}
        run: >-
          .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
          --junitxml=junit.xml -o junit_duration_report=total
      - name: Upload per-test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  fast-jax:
    name: fast jax
    needs: changes
    if: needs.changes.outputs.scope == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Fast suite with jax installed
        # jit-compile bound; an actions/cache of tests/.jax_cache was measured
        # not to help (8:18 warm against 8:12 cold — weekly.yml's note, kept
        # with the job it explains), so there is no cache step.
        env:
          RIETX_TUTORIALS: skip
        run: >-
          .venv/bin/python -m pytest -n auto --dist loadgroup -m "not slow"
          --junitxml=junit.xml -o junit_duration_report=total
      - name: Upload per-test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-jax
          path: junit.xml
          if-no-files-found: warn
          retention-days: 30

  ci-ok:
    # The one check branch protection names beside lint.  It fails when a
    # needed job failed or was cancelled, and when the suite `changes` chose
    # did not pass: the matrix for `code`, the docs job for `docs`.  A job
    # that skipped where it should have run is red here, not a quiet pass.
    # A draft skips this too, and a skipped check reports success, which is
    # safe because a draft cannot merge.
    if: always() && github.event.pull_request.draft != true
    needs: [lint, changes, docs, fast, fast-jax]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)\t\(.value.outputs)"' <<< "$NEEDS"
          jq -e '
            def ok($job): .[$job].result == "success";
            ok("lint") and ok("changes")
            and (if .changes.outputs.scope == "docs" then ok("docs")
                 else ok("fast") and ok("fast-jax") end)
            and all(.[]; .result == "success" or .result == "skipped")
          ' <<< "$NEEDS"
