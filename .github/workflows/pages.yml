name: Docs site

# Builds the Sphinx manual under -W and publishes it to GitHub Pages
# (WP-1003), with the agent skill copied verbatim into the site root beside it
# — _about.DOCS_URL is the one authority for the resulting URLs, and the skill
# is fetchable file by file at /skill/rietx/… so a harness with network and no
# wheel can pull the body without pulling the reference files it does not need
# (WP-1304).  The pointer this replaced, published at /AGENT_PROTOCOL.md from
# v1.0 to v1.3, was deleted in v1.4 and that URL now 404s.
#
# Since WP-1331 the site root is the landing page, not the manual: sphinx's
# root document is manual.md, and docs/landing/build.py --site writes the page
# into docs/landing/site, which conf.py copies in through html_extra_path.  So
# / is the landing page and /manual.html the manual; no other URL moved.
#
# The package itself is installed before the build because docs/manual/conf.py
# injects fenced constants from the live package; a source-only checkout
# builds a manual that quotes nothing.
#
# No path filter: the manual's substitutions mean a src/ change can move a
# rendered page, and a stale published page is worse than a redundant
# three-minute build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 15 until WP-1966: an uncached run adds ~6 min of WebAssembly builds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # The release tags, each at depth 1: the landing page's Jupyter quickstart links the
      # notebooks at the newest one, and build.py refuses without one (WP-1917).  The
      # default depth-1 checkout has no tags.  This fetch added 23 MB, measured 2026-10-09.
      - run: git fetch --depth=1 origin '+refs/tags/v*:refs/tags/v*'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[docs]"
      # Before sphinx: docs/manual/conf.py adds docs/landing/site to
      # html_extra_path only if it exists, and it reads that at conf load.
      - name: Build the landing page
        run: .venv/bin/python docs/landing/build.py --site
      - name: Build the manual (-W, as the test suite does)
        run: .venv/bin/python -m sphinx -W -b html docs/manual site
      # The new manual (WP-1978) at /docs/dev/, then each kept release's tree beside it
      # (WP-1979; docs/docs_versions.py says how they are chosen and laid out).  DOCS_VERSION
      # is set because main, at the commit a release is cut from, carries that release's
      # version and still deploys here.  release.yml dispatches this workflow once a new
      # release's tree is attached.
      - name: Build main's new manual as /docs/dev/ (-W)
        env:
          DOCS_VERSION: dev
        run: .venv/bin/python -m sphinx -W -b html -d "$RUNNER_TEMP/doctrees" docs/docs site/docs/dev
      - name: Add the kept releases, the version switcher and /docs/
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python docs/docs_versions.py site
      - name: The agent skill, verbatim, beside the manual
        run: |
          mkdir -p site/skill
          cp -R docs/skill/rietx site/skill/rietx
      # The tutorials in the browser, at /lite/ (WP-1966; docs/lite/README.md).  gemmi,
      # spglib and rietx-kernels cross-compiled for Pyodide take ~6 min, so they are
      # cached on the script that builds them and on the kernels' own source, which it
      # builds from this checkout.  The site serves a rietx wheel built from this commit
      # with this commit's notebooks: the two match by construction, which is the rule
      # the landing page's tag keeps for Colab (WP-1917), and a fix reaches the browser
      # on merge rather than at the next release.
      # kernels/** is the path kernels.yml rebuilds on, so its pyproject.toml (maturin's
      # config) re-keys the cache too.  Saved as soon as the wheels exist rather than at
      # job end: cancel-in-progress would otherwise discard six minutes on a busy main.
      - uses: actions/cache/restore@v4
        id: lite-wheels
        with:
          path: docs/lite/wheels
          key: lite-wheels-${{ hashFiles('docs/lite/build_wheels.py', 'kernels/**') }}
      - name: Build gemmi, spglib and rietx-kernels for Pyodide
        if: steps.lite-wheels.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build
          python3 docs/lite/build_wheels.py docs/lite/wheels
      - uses: actions/cache/save@v4
        if: steps.lite-wheels.outputs.cache-hit != 'true'
        with:
          path: docs/lite/wheels
          key: ${{ steps.lite-wheels.outputs.cache-primary-key }}
      - name: Build the JupyterLite site
        run: |
          uv build --wheel --out-dir dist .
          uv venv --python 3.13 /tmp/lite
          uv pip install --python /tmp/lite/bin/python -r docs/lite/requirements.txt
          /tmp/lite/bin/python docs/lite/build.py --wheels docs/lite/wheels --ref HEAD \
            --rietx-wheel dist/rietx-*.whl --out site/lite
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
