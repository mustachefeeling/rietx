name: Docs site

# Builds the Sphinx manual under -W and publishes it to GitHub Pages
# (WP-1003), with docs/AGENT_PROTOCOL.md copied verbatim into the site root —
# _about.DOCS_URL is the one authority for the resulting URLs, and
# agent._TOOL_DESCRIPTION appends /AGENT_PROTOCOL.md to it, so the layout
# here (manual at the root, protocol beside it) is part of that contract.
#
# The package itself is installed before the build because docs/manual/conf.py
# injects fenced constants from the live package; a source-only checkout
# builds a manual that quotes nothing.
#
# No path filter: the manual's substitutions mean a src/ change can move a
# rendered page, and a stale published page is worse than a redundant
# three-minute build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[docs]"
      - name: Build the manual (-W, as the test suite does)
        run: .venv/bin/python -m sphinx -W -b html docs/manual site
      - name: The agent protocol, verbatim, beside the manual
        run: cp docs/AGENT_PROTOCOL.md site/AGENT_PROTOCOL.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
