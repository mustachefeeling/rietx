name: nightly

# Everything the per-push gate (ci.yml) deliberately leaves out:
#
# * the `slow` real-data acceptance suites (11-BM NAC, SRM 660c, fluorapatite,
#   the IUCr QPA round robin, the capillary and Stephens suites) — 81 tests
#   that dominate wall clock;
# * macOS, which bills at a 10x minute multiplier on a private repo and so is
#   not worth a per-commit job while the maintainer develops on it;
# * the ~500 MB `[torch]` wheel, which would dominate per-push job setup.
#
# No data is fetched.  Every pattern the acceptance suites need is vendored in
# tests/data/ (18 MB, provenance in tests/data/README.md) — the pre-split
# roadmap's "nightly heavy validation with fetched data" predates that.  If the
# QARR round-robin patterns are ever un-vendored (see WP-1003), the fetch route
# is the Internet Archive, not iucr.org, which is behind a Cloudflare JS
# challenge: web.archive.org/web/2020id_/…/QARR/col/<name>.prn

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  full:
    name: full ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          # macOS/arm64 is where tests/data/backend_goldens/*.npz were captured
          # (Accelerate BLAS), so this is the job that can hold them to
          # bit-identity if the Linux ones turn out not to be able to.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev,jax]"
      - name: Record the environment
        run: |
          .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          .venv/bin/python -c "import numpy; numpy.show_config()"
      - name: Full suite (including the slow real-data acceptance)
        run: .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25
      - name: Upload obs/calc/diff plots
        # every test refinement writes them (CLAUDE.md's Tests convention);
        # Rwp hides locally-bad fits, so on a nightly failure these are the
        # first thing to look at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7

  torch:
    # EXPERIMENTAL backend, ~500 MB wheel: an independent opinion in the
    # Jacobian-agreement matrix, not a supported runtime.  CPU fp64 only —
    # torch.backends.mps.is_available() is False on hosted macOS runners
    # (virtualised, no Metal device), so every `torch-mps` assertion self-skips
    # here and the Apple-GPU evidence for the WP-0403 fp32-column policy stays
    # maintainer-machine-only.  Do not read this job green as "MPS verified".
    name: torch (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax,torch]"
      - name: Backend agreement matrix with every backend installed
        run: |
          .venv/bin/python -m pytest \
            tests/test_cross_backend.py \
            tests/test_backend_conformance.py \
            tests/test_backend_torch.py \
            tests/test_backend_jax.py \
            tests/test_backend_shim.py
      - name: Assert the MPS rows really did skip rather than silently vanish
        run: .venv/bin/python -c "import torch; assert not torch.backends.mps.is_available(), 'hosted runner grew a Metal device — promote the MPS assertions out of maintainer-only status'"
