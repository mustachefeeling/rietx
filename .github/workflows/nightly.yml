name: nightly

# The half of the suite the per-push gate (ci.yml) leaves out: the `slow`
# real-data acceptance suites — 11-BM NAC, SRM 660c, fluorapatite, the IUCr QPA
# round robin, the capillary, dispersion, sequential and Stephens suites — 81
# tests that dominate wall clock and are the whole reason for the `slow` marker.
#
# Linux only, once a day.  macOS and `[torch]` live in weekly.yml, and the
# reason is arithmetic rather than taste: this repo is private on a free plan,
# so Actions minutes are metered at 2000/month and **macOS bills at 10x**.  One
# nightly macOS full-suite job would be ~400 charged minutes a night — 6x the
# entire monthly quota by itself.  Publishing the repo for the v1.0 release
# stops the meter, and that is the moment to fold weekly.yml back into this one.
#
# No data is fetched.  Every pattern the acceptance suites need is vendored in
# tests/data/ (18 MB, provenance in tests/data/README.md) — the pre-split
# roadmap's "nightly heavy validation with fetched data" predates that.  If the
# QARR round-robin patterns are ever un-vendored (see WP-1003), the fetch route
# is the Internet Archive, not iucr.org, which is behind a Cloudflare JS
# challenge: web.archive.org/web/2020id_/…/QARR/col/<name>.prn

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  full:
    name: full suite (Linux, incl. slow acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev,jax]"
      - name: Restore the JAX compile cache
        # the jax rows are jit-compile bound and xdist gives each worker a cold
        # cache (WP-0404); ~106 MB, keyed by a content hash of the computation
        # so a stale entry is a miss rather than a wrong answer
        uses: actions/cache@v6
        with:
          path: tests/.jax_cache
          key: jax-cache-nightly-${{ runner.os }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            jax-cache-nightly-${{ runner.os }}-
      - name: Record the environment
        run: |
          .venv/bin/python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          .venv/bin/python -c "import numpy; numpy.show_config()"
      - name: Full suite (including the slow real-data acceptance)
        # the bit-identity goldens skip here — they are pinned to darwin/arm64
        # (tests/test_backend_shim.py, GOLDEN_PLATFORM) and weekly.yml is where
        # the comparison is reported — no CI runner reproduces their capture
        # machine, so no job asserts them
        run: .venv/bin/python -m pytest -n auto --dist loadgroup --durations=25
      - name: Upload obs/calc/diff plots
        # every test refinement writes them (CLAUDE.md's Tests convention);
        # Rwp hides locally-bad fits, so on a nightly failure these are the
        # first thing to look at
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-linux
          path: tests/output/
          if-no-files-found: warn
          retention-days: 7
