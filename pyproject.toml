[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pxrd-refine"
# Tracks the ROADMAP milestone in flight, not the last one shipped: v0.6 is
# recorded in docs/milestones/v0.6.md and v1.0 is open.  This string is stamped
# into every RefinementResult's Provenance and every history node, so a stale
# value silently mislabels the provenance of real results.
version = "1.0.0.dev0"
description = "API-first, differentiable Rietveld refinement of powder X-ray diffraction data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "pxrd-refine developers" }]
keywords = ["rietveld", "powder-diffraction", "xrd", "crystallography", "refinement"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "gemmi>=0.6.5",
    "spglib>=2.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
# the GUI server (WP-1008+) serves plotly.js out of this package; the built
# frontend assets are committed under src/pxrdref/gui/static, so installing
# the extra never needs node
gui = ["plotly>=5.20"]
baselines = ["pybaselines>=1.1"]
jax = ["jax>=0.4.30"]
# EXPERIMENTAL, and deliberately not part of [dev]: torch is a ~500 MB
# dependency whose CPU Jacobian is ~10x slower than the analytic numpy one and
# whose Apple-GPU path is slower still (measured — docs/milestones/v0.4.md).
# It is kept as an independent opinion in the Jacobian-agreement matrix and as
# the route to using the forward model as a differentiable layer; nobody
# running refinements needs it installed.
torch = ["torch>=2.2"]
docs = [
    "sphinx>=7.4",
    "myst-parser>=3",
    "sphinxcontrib-bibtex>=2.6",
    "furo>=2024.1",
]
dev = [
    # the docs extra rides along so tests/test_manual.py actually builds the
    # theory manual in the standard suite instead of importorskip-ing out
    "pxrd-refine[docs]",
    "pytest>=8",
    "pytest-cov",
    # `-n auto --dist loadgroup` is how the suite is meant to be run; the
    # expensive shared fixtures are pinned to a worker by xdist_group marks
    # (tests/conftest.py), so this is not an optional accelerator
    "pytest-xdist>=3.6",
    "hypothesis>=6",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/pxrd-refine/pxrd-refine"

[project.scripts]
pxrdref = "pxrdref.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pxrdref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running acceptance tests on real data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]
ignore = ["E501"]
