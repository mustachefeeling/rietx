<!doctype html>
<!-- WP-1461: the harness `tests/test_rxplot_browser.py` drives. It loads the
     vendored uPlot and rxplot.mjs as a page would, and mounts three linked panes
     on synthetic data. It is a test file, so it lives in tests/ and never ships. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/uPlot.min.css">
<style>
  :root { --fg: #1b1b1b; --line: #dcdcd6; --plot-calc: #c23b22; --plot-diff: #555555; }
  body { margin: 0; background: #ffffff; }
  #host { width: 800px; height: 490px; }
</style></head><body>
<div id="host"></div>
<script src="/uPlot.iife.min.js"></script>
<script type="module">
import * as rx from "/rxplot.mjs";

const N = 2000;
const X = Float64Array.from({ length: N }, (_, i) => 5 + 55 * i / (N - 1));
const wave = Array.from(X, (x) => 100 + 50 * Math.sin(x));
const delta = Array.from(X, (x) => Math.cos(3 * x));
const host = document.getElementById("host");
window.rx = rx;
window.X = X;
window.paints = {};

// Three panes as the pattern panel stacks them: the curves, a band of ticks with
// a range of its own, and the residual carrying the x labels. `opts.main` swaps
// the main pane's one series, and `opts.y` its scale.
window.mount = (opts = {}) => {
  window.G?.destroy();
  const count = (key) => ({ draw: [() => { window.paints[key] = (window.paints[key] ?? 0) + 1; }] });
  const G = window.G = rx.panes(uPlot, host, {
    x: X,
    panes: [
      { key: "main", height: 300, y: opts.y ?? "lin", hooks: count("main"),
        series: [{ stroke: () => rx.token("--plot-calc"), width: 3 }], data: [opts.main ?? wave] },
      { key: "ticks", height: 40, range: [0, 1], hooks: count("ticks"),
        series: [{ show: false }], data: [new Array(N).fill(null)] },
      { key: "resid", height: 150, xLabels: true, hooks: count("resid"),
        series: [{ stroke: () => rx.token("--plot-diff"), width: 1 }], data: [delta] },
    ],
  });
  G.selects = [];
  G.cursors = [];
  G.onSelect = (lo, hi, key) => G.selects.push([lo, hi, key]);
  G.onCursor = (hit) => G.cursors.push(hit && { key: hit.key, idx: hit.idx });
  return true;
};

// A curves payload as `rx.unpack` returns one (D4): a 5-60° pattern whose fit
// kept 10-40°, and two phases' ticks. `shift` moves every channel, so a payload
// over other channels is one call away.
window.curves = (n = 1100, shift = 0) => {
  const two_theta = Float64Array.from({ length: n }, (_, i) => 5 + shift + 55 * i / (n - 1));
  const y_obs = Float64Array.from(two_theta, (x) => 100 + 50 * Math.sin(x));
  const kept = Int32Array.from([...two_theta.keys()].filter((i) => two_theta[i] >= 10 && two_theta[i] <= 40));
  const on = (f) => Float64Array.from(kept, (i) => f(two_theta[i], y_obs[i]));
  return {
    header: { fit: true, weighted: true, stale: false, ticks: { a: [12, 20, 30], b: [15, 25] } },
    arrays: { two_theta, y_obs, kept, fitted: kept, y_calc: on((x, y) => y + 5), y_background: on(() => 60),
              delta: on((x) => Math.cos(x)), delta_raw: on((x) => 3 * Math.cos(x)),
              cumulative_chi2: on((x) => x * 10) },
  };
};
// every ink distinct and opaque, so a pixel says which curve it is
window.inks = { obs: "#000000", masked: "#0000ff", calc: "#ff0000", bkg: "#00c000", diff: "#ff00ff",
                zero: "#808080", phase: ["#00a0a0", "#a000a0"] };
window.mountPattern = (spec = {}, payload = curves()) => {
  window.G?.destroy();
  window.layers = [];
  const G = window.G = rx.pattern(uPlot, host, payload, {
    colors: () => inks,
    layers: { main: { under: [() => layers.push("under")], over: [() => layers.push("over")] } },
    ...spec,
  });
  return true;
};
// A heat-then-cool series: up 300 → 400 and back, so the chain comes back along
// its own x. Point 1 has no esd; it is reseeded (a ring), and point 3, at the
// same x on the way down, is unrecovered (a cross).
window.loop = () => ({ x: [300, 350, 400, 350, 300], value: [1.0, 1.1, 1.2, 1.15, 1.05],
                       stderr: [0.01, null, 0.01, 0.01, 0.01], backward: null });
window.trajInks = { tone: "#0000ff", warn: "#ff8000", muted: "#808080" };
window.mountTrajectory = (spec = {}, traj = loop()) => {
  window.G?.destroy();
  const G = window.G = rx.trajectory(uPlot, host, traj, {
    colors: () => trajInks, rings: [false, true, false, false, false],
    crosses: [false, false, false, true, false], xLabel: "T", yLabel: "a", ...spec,
  });
  G.points = [];
  G.onPoint = (hit) => G.points.push(hit && { i: hit.i, chain: hit.chain });
  return true;
};
// Three fits of one pattern on one grid, as `rietx compare` hands the overlay
// them: `k` scales each fit's residual, so its cumulative χ² is k² times a's.
window.fits = (n = 1000) => {
  const x = Float64Array.from({ length: n }, (_, i) => 10 + 50 * i / (n - 1));
  const obs = Float64Array.from(x, (v) => 100 + 50 * Math.sin(v));
  const fit = (key, k, offset) => {
    const delta = Float64Array.from(x, (v) => k * Math.cos(v));
    let sum = 0;
    return { key, delta, cum: Float64Array.from(delta, (d) => (sum += d * d)),
             calc: Float64Array.from(obs, (y) => y + offset) };
  };
  return { x, obs, ticks: { a: [20, 30], b: [25] }, fits: [fit("a", 1, 2), fit("b", 0.5, -2), fit("c", 2, 4)] };
};
window.fitInks = { obs: "#000000", zero: "#808080", phase: ["#00a0a0", "#a000a0"],
                   fits: { a: "#ff0000", b: "#0000ff", c: "#00c000" } };
window.mountOverlay = (spec = {}, data = fits()) => {
  window.G?.destroy();
  window.G = rx.overlay(uPlot, host, data, { colors: () => fitInks, reference: "a", height: 120, ...spec });
  return true;
};
window.ready = true;
</script></body></html>
