<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/uplot/dist/uPlot.min.css">
<style>
body{margin:0;background:#fff;color:#222;font:12px system-ui}
.pane{position:relative;width:1200px;margin-bottom:10px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #ccc;padding:3px 6px;display:none;font:11px ui-monospace,monospace;white-space:pre;z-index:10}
</style></head><body>
<div class="pane" id="traj"><div class="tip"></div></div>
<div class="pane" id="cmp"><div class="tip"></div></div>
<div class="pane" id="film"><div class="tip"></div></div>
<script src="node_modules/uplot/dist/uPlot.iife.min.js"></script>
<script>
const W = 1200, X0 = 5, X1 = 60;
const lcg = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const lower = (a, v) => { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; };
function wheel(u) {
  u.over.addEventListener("wheel", (e) => {
    e.preventDefault(); const { min, max } = u.scales.x;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { const d = (max - min) * e.deltaX / 1000; u.setScale("x", { min: min + d, max: max + d }); }
    else { const x = u.posToVal(e.offsetX, "x"), f = Math.exp(e.deltaY * 0.002); u.setScale("x", { min: x - (x - min) * f, max: x + (max - x) * f }); }
  }, { passive: false });
}
function tipper(u, el, text) {   // a floating tooltip beside the cursor
  const tip = el.querySelector(".tip"); const { left, top } = u.cursor;
  if (left == null || left < 0) { tip.style.display = "none"; return; }
  const t = text(u); if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t; tip.style.display = "block";
  tip.style.left = Math.min(u.over.offsetLeft + left + 14, W - 200) + "px"; tip.style.top = (u.over.offsetTop + top + 14) + "px";
}
const Q = {};

// ------------------------------------------------ the Series panel: a trajectory with esd whiskers
Q.traj = (n = 60) => {
  const r = lcg(11), T = [], a = [], esd = [], back = [], reseed = [], unrec = [];
  for (let i = 0; i < n; i++) {
    T.push(300 + 10 * i); const v = 10.25 + 2e-5 * i + 1e-4 * (r() - 0.5); a.push(v); esd.push(2e-5 + 4e-5 * r());
    back.push(v + 3e-5 * (r() - 0.5)); reseed.push(i % 13 === 5 ? v : null); unrec.push(i === 41);
  }
  if (unrec[41]) a[41] = null;
  const el = document.getElementById("traj");
  const whiskers = (u) => {
    const { ctx } = u; ctx.save(); ctx.strokeStyle = "#1f77b4"; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < n; i++) { if (a[i] == null) continue; const X = Math.round(u.valToPos(T[i], "x", true)) + 0.5, y0 = u.valToPos(a[i] - esd[i], "y", true), y1 = u.valToPos(a[i] + esd[i], "y", true);
      ctx.moveTo(X, y0); ctx.lineTo(X, y1); ctx.moveTo(X - 3, y0); ctx.lineTo(X + 3, y0); ctx.moveTo(X - 3, y1); ctx.lineTo(X + 3, y1); }
    ctx.stroke();
    ctx.strokeStyle = "#d62728"; ctx.lineWidth = 1.5; ctx.beginPath();   // an unrecovered pattern: a cross on the axis floor
    unrec.forEach((f, i) => { if (!f) return; const X = u.valToPos(T[i], "x", true), Y = u.bbox.top + u.bbox.height - 8; ctx.moveTo(X - 5, Y - 5); ctx.lineTo(X + 5, Y + 5); ctx.moveTo(X + 5, Y - 5); ctx.lineTo(X - 5, Y + 5); });
    ctx.stroke(); ctx.restore();
  };
  Q.trajU = new uPlot({ width: W, height: 260, legend: { show: true }, scales: { x: { time: false } },
    cursor: { points: { show: true } },
    series: [{ label: "T (K)" },
      { label: "a (Å)", stroke: "#1f77b4", width: 1.2, points: { show: true, size: 5 } },
      { label: "backward chain", stroke: "#1f77b4", width: 1, dash: [2, 3], points: { show: false } },
      { label: "reseeded", stroke: "#ff7f0e", paths: () => null, points: { show: true, size: 11, fill: "#fff", width: 1.5 } }],
    hooks: { draw: [whiskers], setCursor: [(u) => tipper(u, el, (u) => { const i = u.cursor.idx; return i == null ? "" : a[i] == null ? `T ${T[i]} K\nunrecovered` : `T ${T[i]} K\na ${a[i].toFixed(6)}(${Math.round(esd[i] * 1e6)}) Å`; })] } },
    [T, a, back, reseed], el);
  wheel(Q.trajU);
};

// ------------------------------------------------ the compare page: ten variants' cumulative Δχ² over one grid
Q.cmp = (N = 22003, k = 10) => {
  const x = new Float64Array(N), series = [{}], data = [x], pal = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"];
  for (let i = 0; i < N; i++) x[i] = X0 + (X1 - X0) * i / (N - 1);
  for (let v = 0; v < k; v++) {
    const r = lcg(20 + v), y = new Float64Array(N); let acc = 0;
    for (let i = 0; i < N; i++) { acc += (r() - 0.48 - v * 0.002) * 3; y[i] = acc; }
    data.push(y); series.push({ label: "variant " + v, stroke: pal[v], width: 1 });
  }
  const el = document.getElementById("cmp");
  Q.cmpU = new uPlot({ width: W, height: 300, legend: { show: true, live: false }, scales: { x: { time: false } }, series,
    cursor: { points: { show: false }, focus: { prox: 16 } }, focus: { alpha: 0.25 },
    hooks: { setCursor: [(u) => tipper(u, el, (u) => { const i = u.cursor.idx; if (i == null) return ""; return `2θ ${x[i].toFixed(3)}\n` + series.slice(1).map((s, j) => `${s.label} ${data[j + 1][i].toFixed(1)}`).join("\n"); })] } },
    data, el);
  wheel(Q.cmpU);
};

// ------------------------------------------------ an in-situ 2D map: M patterns x N channels, max-pooled pyramid
Q.film = (M = 200, N = 22003) => {
  const t0 = performance.now(), dx = (X1 - X0) / (N - 1), x = new Float64Array(N);
  for (let i = 0; i < N; i++) x[i] = X0 + i * dx;
  const base = new Float64Array(N); const pr = lcg(99);
  for (let k = 0; k < 300; k++) { const p = X0 + (X1 - X0) * pr(), h = 200 + 5000 * pr() ** 3; const lo = Math.max(0, Math.floor((p - 0.8 - X0) / dx)), hi = Math.min(N - 1, Math.ceil((p + 0.8 - X0) / dx)); for (let i = lo; i <= hi; i++) { const d = (x[i] - p) / 0.02; base[i] += h / (1 + d * d); } }
  const img = new Float32Array(M * N); let vmax = 0;
  for (let r = 0; r < M; r++) {   // thermal expansion: row r is the base pattern squeezed by 1.5e-4 per row
    const s = 1 - r * 1.5e-4;
    for (let i = 0; i < N; i++) { const f = (x[i] * s - X0) / dx, j = Math.floor(f); const v = j >= 0 && j < N - 1 ? base[j] + (base[j + 1] - base[j]) * (f - j) : 0; const q = Math.sqrt(v + 50); img[r * N + i] = q; if (q > vmax) vmax = q; }
  }
  const lut = new Uint8ClampedArray(256 * 4);
  for (let c = 0; c < 256; c++) { const t = c / 255; lut.set([Math.round(255 * Math.min(1, Math.max(0, 1.5 * t - 0.3))), Math.round(255 * Math.min(1, t * 1.2)), Math.round(255 * Math.min(1, 0.4 + 0.8 * t - 0.9 * t * t)), 255], c * 4); }
  const levels = []; let w = N, data = img;
  for (;;) {
    const cv = document.createElement("canvas"); cv.width = w; cv.height = M; const g = cv.getContext("2d"), id = g.createImageData(w, M);
    for (let r = 0; r < M; r++) for (let i = 0; i < w; i++) { const c = Math.min(255, Math.round(255 * data[r * w + i] / vmax)) * 4, o = ((M - 1 - r) * w + i) * 4; id.data[o] = lut[c]; id.data[o + 1] = lut[c + 1]; id.data[o + 2] = lut[c + 2]; id.data[o + 3] = 255; }
    g.putImageData(id, 0, 0); levels.push({ w, cv });
    if (w <= 1024) break;
    const w2 = Math.ceil(w / 2), d2 = new Float32Array(w2 * M);
    for (let r = 0; r < M; r++) for (let j = 0; j < w2; j++) { const a = data[r * w + 2 * j], b = 2 * j + 1 < w ? data[r * w + 2 * j + 1] : a; d2[r * w2 + j] = a > b ? a : b; }
    data = d2; w = w2;
  }
  const buildMs = performance.now() - t0;
  const draw = (u) => {   // the coarsest level that still has a column for every device pixel of the window
    const { ctx, bbox, scales } = u, frac = (scales.x.max - scales.x.min) / (X1 - X0);
    let L = levels[0]; for (const l of levels) if (l.w * frac >= bbox.width) L = l;
    const sx = (scales.x.min - X0) / (X1 - X0) * L.w, sw = frac * L.w;
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(L.cv, sx, 0, sw, M, bbox.left, bbox.top, bbox.width, bbox.height); ctx.restore();
  };
  const el = document.getElementById("film");
  Q.filmU = new uPlot({ width: W, height: 360, legend: { show: false }, scales: { x: { time: false }, y: { range: [0, M] } },
    cursor: { points: { show: false } }, series: [{}, { show: false }],
    hooks: { drawClear: [draw], setCursor: [(u) => tipper(u, el, (u) => { const i = u.cursor.idx, r = Math.floor(u.posToVal(u.cursor.top, "y")); return i == null || r < 0 || r >= M ? "" : `2θ ${x[i].toFixed(4)}\npattern ${r}\n√I ${img[r * N + i].toFixed(1)}`; })] } },
    [x, new Array(N).fill(null)], el);
  wheel(Q.filmU);
  return { buildMs, levels: levels.map((l) => l.w) };
};
window.Q = Q;
</script></body></html>
