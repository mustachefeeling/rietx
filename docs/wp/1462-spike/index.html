<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Impostor viewer prototype</title>
<style>
  html, body { margin: 0; background: #fff; font: 14px system-ui, sans-serif; }
  #wrap { position: relative; width: 640px; height: 520px; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .axis-label { position: absolute; left: 0; top: 0; color: #1f5fbf; font-weight: 600; }
  #tip { position: absolute; background: #222; color: #fff; padding: 2px 6px; font-size: 12px; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="overlay"></div><div id="tip"></div></div>
<script type="module">
const t0 = performance.now();
const { createViewer } = await import("./viewer.js");
const tImport = performance.now();
const q = new URLSearchParams(location.search);
const name = q.get("s") || "lab6", mode = q.get("mode") || "ball";
const g = await (await fetch(`./${name}.json`)).json();
const tData = performance.now();
const v = createViewer(document.getElementById("c"), document.getElementById("overlay"));
const tCreate = performance.now();
if (q.get("rot")) v.rotate([1, 0.6, 0], Number(q.get("rot")));
if (q.get("zoom")) v.zoom(Number(q.get("zoom")));
v.set(g, { mode, exaggeration: Number(q.get("ex") || 1), poly: q.has("poly") });
const tSet = performance.now();
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
const tFrame = performance.now();
window.viewer = v;
window.timings = { import: tImport - t0, create: tCreate - tData, set: tSet - tCreate, toFrame: tFrame - tData, counts: v.counts() };

const tip = document.getElementById("tip"), canvas = document.getElementById("c");
canvas.addEventListener("mousemove", (ev) => {
  const r = canvas.getBoundingClientRect();
  const hit = v.pick(ev.clientX - r.left, ev.clientY - r.top);
  if (!hit) { tip.style.display = "none"; return; }
  const a = g.atoms[hit.index], s = g.sites[a.site];
  tip.textContent = `${s.label} ${s.species} (${a.frac.map((x) => x.toFixed(3)).join(", ")})`;
  tip.style.display = "block";
  tip.style.left = `${ev.clientX - r.left + 12}px`; tip.style.top = `${ev.clientY - r.top + 12}px`;
});

// rotation: n frames, each rotates and draws; CPU time of the draw call and rAF gaps
window.spin = async (n = 240) => {
  const work = [], gaps = [];
  let last = performance.now();
  for (let i = 0; i < n; i++) {
    await new Promise((r) => requestAnimationFrame(r));
    const now = performance.now();
    gaps.push(now - last); last = now;
    v.rotate([0.3, 1, 0.1], 0.02);
    const a = performance.now(); v.draw(); work.push(performance.now() - a);
  }
  return { work, gaps };
};
window.pickBench = (n = 2000) => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  let hits = 0;
  const a = performance.now();
  for (let i = 0; i < n; i++) if (v.pick(Math.random() * w, Math.random() * h)) hits++;
  return { perPick: (performance.now() - a) / n, hits };
};
window.ready = true;
</script>
</body>
</html>
