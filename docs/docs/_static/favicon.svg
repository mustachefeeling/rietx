<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="rietx">
  <!-- The old manual's mark (`docs/manual/_static/favicon.svg`, whose comment
       says why it is drawn this way) in this manual's teal, so the tab and the
       header agree.  These two hexes are `--rietx-ink` in `custom.css`; a
       standalone SVG loaded as an icon reads no CSS variable, so they are
       literal here, and `tests/test_manual.py` holds the two copies equal. -->
  <style>
    .ink { fill: #0a7d91 }
    @media (prefers-color-scheme: dark) { .ink { fill: #3fb1c5 } }
  </style>
  <g class="ink">
    <path d="M2 26 C7 26 9 23 11.5 3.5 C14 23 16 26 21 26 Z"/>
    <path d="M17 26 C20 26 21.5 24 23 13 C24.5 24 26 26 29 26 Z"/>
    <rect x="1.5" y="25.5" width="29" height="3" rx="1.5"/>
  </g>
</svg>
