# One concept, one term: the reject side of the term list.  Each key is a
# synonym a reader will meet elsewhere, and its value is the word this manual
# uses.
#
# The first block is the repo's own.  `rietx.help`'s titles name each
# parameter, and the IUCr's nomenclature reports settle the rest (Trueblood et
# al. 1996, Acta Cryst. A52, 770: "displacement parameter" for "thermal
# parameter" and "temperature factor").  The crystallographer's term leads
# (WP-1981's review, rule 2).
#
# The second block is Microsoft.Terms (package v0.15.1) whole, copied because
# Vale cannot switch off one entry of a rule, less six entries:
#   agent -> personal digital assistant   this manual writes for AI agents
#   afterwards -> afterward               British spelling wins (layer 1)
#   licensing terms -> license terms      British "licence" for the noun
#   numerical -> numeric                  "numerical absorption correction"
#   home directory -> root directory      two different directories
#   kb, mb, gb ... -> KB, MB, GB ...      SI writes kB, and with ignorecase
#                                         the rule flagged it
extends: substitution
message: "Use '%s' instead of '%s'."
level: warning
ignorecase: true
action:
  name: replace
swap:
  # The repo's terms.
  "cell (?:edge|length|constant)s?": lattice parameter
  "lattice constants?": lattice parameter
  "cell angles?": lattice parameter α, β or γ
  "(?:thermal|temperature) (?:parameter|factor)s?": displacement parameter
  "spacegroups?": space group
  "sample (?:displacement|height)(?: error)?": specimen displacement
  "zero(?:-point)? (?:offset|error)": zero-point shift
  # Microsoft.Terms, less the six above.
  "(?:assembler|machine language)": assembly language
  "(?:drive C:|drive C>|C: drive)": drive C
  "(?:internet bot|web robot)s?": bot(s)
  "(?:microsoft cloud|the cloud)": cloud
  "(?:mobile|smart) ?phone": phone
  "24/7": every day
  "audio(?:-| )book": audiobook
  "back(?:-| )light": backlight
  "chat bots?": chatbot(s)
  "(?:display|graphics) driver": video driver
  "(?:okay|all right|alright)": OK
  "(?:video|display|graphics) adapter": video card
  "graphics (?:card|board)": video card
  "italic(?:s|ized)": italic
  "(?:command|option|action) button": button
  "type size": font size
  "type style": font style
  "(?:bolded|boldfaced|boldface)": bold
  "(?:end-user license agreement|EULA)": Microsoft Software License Terms
  "(?:microsoft recommends|it is recommended)": we recommend
  "(?:pop-up window|dialogue box)": dialog box
  "maximize (?:box|icon)": Maximize button
  "minimize (?:box|icon)": Minimize button
  "12:00 midnight": midnight
  "12:00 noon": noon
  adaptor: adapter
  administrate: administer
  alphabetic: alphabetical
  alphanumerical: alphanumeric
  a ISP: an ISP
  a SQL: an SQL
  an DLL: a DLL
  an URL: a URL
  anti-aliasing: antialiasing
  anti-malware: antimalware
  anti-spyware: antispyware
  anti-virus: antivirus
  appendixes: appendices
  artificial intelligence: AI
  broadcasted: broadcast
  caap: CaaP
  conversation-as-a-platform: conversation as a platform
  core document: main document
  different to: different from
  double-click on: double-click
  ebook: e-book
  ecommerce: e-commerce
  ediscovery: e-discovery
  elearning: e-learning
  end user: user
  esports: e-sports
  gbps: Gbps
  hoster: hosting provider
  information technology: IT
  insertion point: pointer
  it professional: IT pro
  keypress: keystroke
  lowercased: lowercase
  matrixes: matrices
  mobile computer: computer
  mouse over: hover over
  moveable: movable
  numeric keyboard: numeric keypad
  off-premise: off-premises
  on-premise: on-premises
  pathname: path
  read-write: read/write
  smart technology: intelligent technology
  spec: specification
  stylus: pen
  target drive: destination drive
  target file: destination file
  typeface: font
  unprintable: nonprintable
  uppercased: uppercase
  videoconference: video call
  wireless phone: phone
  zeroes: zeros
