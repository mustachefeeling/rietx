# Microsoft.Vocab (package v0.15.1), copied for the reason rietx/Terms.yml
# gives: an accept-list word would exempt its phrases from every rule.
# Dropped, each for a stated reason:
#   sample, against   a powder sample, a fit against the data: domain words
#   above             the page contract already refuses a section that opens
#                     on "as above"; "above 90°" is a position
#   author, alias     the author of a paper; a program's alias is its name
#   beta              a crystallographic angle
#   he, she           kept below: there is no person here to gender
extends: existence
message: "Check '%s' against Microsoft's A-Z word list."
link: https://learn.microsoft.com/en-us/style-guide
level: suggestion
ignorecase: true
tokens:
  - accessible
  - actionable
  - alarm
  - alert
  - allows?
  - and/or
  - as well as
  - assure
  - avg
  - ensure
  - he
  - insure
  - set (?:a|an|the|your)
  - she
  - specify
