# Vale over the new manual (WP-1982).  Four style layers, the first winning
# (WP-1975 § F8): the repo's own rules (docs/vale/rietx/ and the register
# guard in tests/test_manual.py), the term list (docs/vale/terms.py writes
# the accept side, docs/vale/rietx/Terms.yml holds the reject side),
# Microsoft's Writing Style Guide as the base, and Vale running all three.
#
#   vale sync              # once: fetches the Microsoft package pinned below
#   vale docs/docs         # exits 1 on an error-level alert
#
# An error is a rule the repo has decided, so CI fails on one.  A warning or a
# suggestion is a style question for whoever edits the page.
StylesPath = docs/vale
MinAlertLevel = suggestion
Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = rietx

# Every committed page of the new tree.  A directory named with a leading
# underscore is build output: `_build/`, and `_generated/`, the Reference
# bodies written from the package's own strings.  WP-1985 rewrites those
# strings and widens this section to read them.
[docs/docs/[!_]*.md]
BasedOnStyles = Vale, Microsoft, rietx
# A MyST substitution, {{ NAME }}, is a constant the build injects; "et al."
# is a citation's Latin.
TokenIgnores = \{\{[^}]*\}\}, \bet al\.

# British spelling, from the en_GB dictionary in docs/vale/config/dictionaries/.
Vale.Spelling = NO

# Each Microsoft rule the house style contradicts, and why.
# The house style writes without the Oxford comma.
Microsoft.OxfordComma = NO
# British usage puts punctuation outside a quotation it is not part of.
Microsoft.Quotes = NO
# The house style lowercases after a heading's colon ("API: everyday calls").
Microsoft.HeadingColons = NO
# Replaced by rietx.Terms and rietx.Vocab, each a copy less the stated entries.
Microsoft.Terms = NO
Microsoft.Vocab = NO
# Contractions are welcome and never required ("do not" is not an error).
Microsoft.Contractions = suggestion
